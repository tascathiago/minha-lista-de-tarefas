<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Minha Lista de Tarefas Diarias</h1>
    <p>Organize suas tarefas do dia de forma simples.</p>

    <form id="task-form">
      <input id="task-input" type="text" placeholder="Digite uma tarefa">
      <button type="submit">Adicionar</button>
    </form>

    <ul id="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
